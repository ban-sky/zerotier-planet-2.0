services:
  zerotier-planet:
    image: docker.io/lonelyx/zerotier-planet:2.0.2
    container_name: ${CONTAINER_NAME}
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      IP_ADDR4: "${IP_ADDR4}"
      IP_ADDR6: "${IP_ADDR6}"
      TZ: "${TZ}"
      TLS_ENABLED: "1"
    ports:
      - "${PANEL_APP_PORT_ZT}:9994/udp"
      - "${PANEL_APP_PORT_HTTPS}:3443/tcp"
      - "${PANEL_APP_PORT_FILE}:3000/tcp"
    volumes:
      - "./data/config:/app/config"
      - "./data/dist:/app/dist"
      - "./data/one:/var/lib/zerotier-one"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/usr/sbin/zerotier-cli", "info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      createdBy: "Apps"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
