name: Release

# Builds the container image, smoke-tests it, packages it as a loadable
# `docker save` archive and publishes everything to a GitHub Release.
#
# Trigger it by pushing a version tag (v2.0.0, v2.0.1, ...) or manually with
# "Run workflow". The manual run can also additionally produce an arm64
# archive; that leg compiles ZeroTier on a native ARM runner.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag/version for the release (for example v2.0.3)
        required: true
        default: v2.0.3
      include_arm64:
        description: Also build and attach a linux/arm64 archive
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/zerotier-planet
  ZT_VERSION: "1.16.2"
  ZT_COMMIT: "fc5c3ec22090b5b2a0f274e863651fe9ca489bf4"
  ZTNCUI_COMMIT: "1b2284864de48d2dcae22582fff122fe24909c3d"

jobs:
  # -------------------------------------------------------------------------
  # Resolve the version and decide which architectures to build.
  # -------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      image: ${{ steps.version.outputs.image }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${INPUT_TAG}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          case "$version" in
            v[0-9]*) ;;
            *) echo "::error::version must start with 'v' (got '$version')"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image_tag=${version#v}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Releasing $version as ${REGISTRY}/${IMAGE_NAME}:${version#v}"

      - name: Choose architectures
        id: matrix
        env:
          INCLUDE_ARM64: ${{ inputs.include_arm64 }}
        run: |
          set -euo pipefail
          entries='{"platform":"linux/amd64","arch":"amd64","runner":"ubuntu-latest"}'
          if [ "$INCLUDE_ARM64" = "true" ]; then
            entries="$entries,{\"platform\":\"linux/arm64\",\"arch\":\"arm64\",\"runner\":\"ubuntu-24.04-arm\"}"
          fi
          echo "matrix={\"include\":[${entries}]}" >> "$GITHUB_OUTPUT"
          echo "building: ${entries}"

  # -------------------------------------------------------------------------
  # Build one architecture and export it as a `docker save` archive.
  # -------------------------------------------------------------------------
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.image_tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            ZT_VERSION=${{ env.ZT_VERSION }}
            ZT_COMMIT=${{ env.ZT_COMMIT }}
            ZTNCUI_COMMIT=${{ env.ZTNCUI_COMMIT }}
            APT_MIRROR=http://deb.debian.org
            GH_MIRROR=https://github.com
            GH_FALLBACK=https://github.com
            BUILD_JOBS=4
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          provenance: false

      - name: Package the image as a docker-load archive
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          # docker save keeps the local tag; use the plain version so a user can
          # `docker load` and immediately run `docker run <image>:<version>`.
          local_tag="${IMAGE}:${TAG}"
          docker tag "${IMAGE}:${TAG}-${ARCH}" "$local_tag"
          tarball="zerotier-planet-2.0-${TAG}-${ARCH}.tar.gz"
          docker save "$local_tag" | gzip -6 > "$tarball"
          ls -lh "$tarball"
          sha256sum "$tarball" > "$tarball.sha256"
          cat "$tarball.sha256"

      - name: Write archive instructions
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cat > "LOAD-${ARCH}-${TAG}.txt" <<EOF
          zerotier-planet-2.0 ($TAG, ${PLATFORM})

          Load the image:
            docker load < zerotier-planet-2.0-${TAG}-${ARCH}.tar.gz

          The archive restores the tag:
            ${IMAGE}:${TAG}

          Run it (set IP_ADDR4 to the address your clients can reach):
            docker run -d --name zerotier-planet --restart unless-stopped \\
              -p 9994:9994/udp -p 3443:3443/tcp -p 3000:3000/tcp \\
              -e IP_ADDR4=203.0.113.10 \\
              -v "\$PWD/data/config:/app/config" \\
              -v "\$PWD/data/dist:/app/dist" \\
              -v "\$PWD/data/one:/var/lib/zerotier-one" \\
              ${IMAGE}:${TAG}

          The initial admin password is printed by:
            docker exec zerotier-planet cat /app/config/admin-password
          EOF

      - name: Push the arch image to GHCR
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${TAG}-${ARCH}"

      - name: Remove the local tag
        if: always()
        run: docker image rm -f "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.image_tag }}-${{ matrix.arch }}" || true

      - name: Upload packaged image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: |
            zerotier-planet-2.0-*.tar.gz
            zerotier-planet-2.0-*.tar.gz.sha256
            LOAD-*.txt
          retention-days: 7
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Boot the built amd64 image and verify the things the issues complained
  # about: the planet actually gets generated (upstream #213), the controller
  # UI answers with TLS, the file server is authenticated and the file server
  # cannot be used for path traversal (#215).
  # -------------------------------------------------------------------------
  smoke:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Exercise the 1Panel cron helper
        env:
          ZTP_SKIP_ROOT_CHECK: "1"
        run: |
          set -euo pipefail
          bash -n scripts/1panel-scheduled-update.sh
          panel_dir="$(mktemp -d)/panel"

          # --dry-run must report and create nothing (offline path).
          bash -x scripts/1panel-scheduled-update.sh \
            --panel-dir "$panel_dir" --source dir --from-dir . --dry-run --quiet
          test ! -e "$panel_dir"

          # A real sync from the git branch, without restarting containers.
          bash scripts/1panel-scheduled-update.sh \
            --panel-dir "$panel_dir" --source branch --no-restart
          test -f "$panel_dir/resource/apps/local/zerotier-planet/data.yml"
          ls -1 "$panel_dir/resource/apps/local/zerotier-planet"

          # The offline path sees the already-installed version and does nothing.
          out="$(bash scripts/1panel-scheduled-update.sh \
            --panel-dir "$panel_dir" --source dir --from-dir . --no-restart 2>&1)"
          printf '%s\n' "$out" | grep -q '无需更新'

      - name: Download the amd64 archive
        uses: actions/download-artifact@v4
        with:
          name: image-amd64
          path: dist

      - name: Load the image
        run: |
          set -euo pipefail
          ls -lh dist
          docker load < dist/zerotier-planet-2.0-*.tar.gz

      - name: Start the container
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/zt/config /tmp/zt/dist /tmp/zt/one
          docker run -d --name zt-smoke \
            -p 9994:9994/udp -p 3443:3443/tcp -p 3000:3000/tcp \
            -e IP_ADDR4=127.0.0.1 \
            -v /tmp/zt/config:/app/config \
            -v /tmp/zt/dist:/app/dist \
            -v /tmp/zt/one:/var/lib/zerotier-one \
            "${IMAGE}:${TAG}"
          for i in $(seq 1 90); do
            if docker exec zt-smoke /usr/sbin/zerotier-cli info >/dev/null 2>&1; then
              echo "zerotier-one is up after ${i}s"; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' zt-smoke)" != "true" ]; then
              echo "::error::container exited during startup"; docker logs zt-smoke; exit 1
            fi
            sleep 2
          done
          echo "::error::zerotier-one did not start in time"; docker logs zt-smoke; exit 1

      - name: Verify the planet and moon were generated
        run: |
          set -euo pipefail
          docker exec zt-smoke ls -l /app/dist
          size=$(docker exec zt-smoke stat -c %s /app/dist/planet)
          echo "planet size: $size"
          [ "$size" -gt 100 ]
          docker exec zt-smoke sh -c 'ls /app/dist/*.moon'
          docker exec zt-smoke test -s /var/lib/zerotier-one/identity.public
          docker exec zt-smoke test -s /var/lib/zerotier-one/identity.secret
          # the moon and the planet must be different artefacts
          docker exec zt-smoke sh -c 'cmp -s /app/dist/planet /app/dist/*.moon && exit 1 || exit 0'

      - name: Verify no default credentials and no secrets in the log
        run: |
          set -euo pipefail
          docker exec zt-smoke test -s /app/config/admin-password
          docker exec zt-smoke stat -c '%a' /app/config/admin-password | grep -qx 600
          password=$(docker exec zt-smoke sh -c "sed -n 's/^password: //p' /app/config/admin-password")
          echo "generated password length: ${#password}"
          [ "${#password}" -ge 20 ]
          [ "$password" != "password" ]
          # the admin password must never be echoed into the container log
          if docker logs zt-smoke 2>&1 | grep -qF -- "$password"; then
            echo "::error::the generated admin password leaked into the log"; exit 1
          fi
          token=$(docker exec zt-smoke cat /var/lib/zerotier-one/authtoken.secret)
          if docker logs zt-smoke 2>&1 | grep -qF -- "$token"; then
            echo "::error::the controller token leaked into the log"; exit 1
          fi
          docker logs zt-smoke

      - name: Verify the controller UI answers over TLS
        run: |
          set -euo pipefail
          code=""
          for i in $(seq 1 60); do
            code=$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:3443/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "UI status: $code"
          [ "$code" = "200" ]
          # the login form must be served
          curl -ks https://127.0.0.1:3443/login | grep -qi 'name="password"'
          # plaintext HTTP must not be exposed on the controller port
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3443/ || true)
          echo "plaintext on 3443: $code"
          [ "$code" != "200" ]

      - name: Verify the UI is bilingual and proxy origins are accepted
        run: |
          set -euo pipefail
          # Simplified Chinese is the default when the browser does not ask for English
          curl -ks https://127.0.0.1:3443/login -o /tmp/login-zh.html
          grep -q '用户名' /tmp/login-zh.html
          grep -q '密码' /tmp/login-zh.html
          # English on request
          curl -ks https://127.0.0.1:3443/login -H 'Accept-Language: en' -o /tmp/login-en.html
          grep -q 'Username' /tmp/login-en.html
          grep -q 'Sign in' /tmp/login-en.html
          # the switch endpoint stores the choice and redirects to a local path only
          curl -ks -o /dev/null -D /tmp/lang.headers https://127.0.0.1:3443/lang/en
          grep -qi 'set-cookie: lang=en' /tmp/lang.headers
          grep -qi '^location: /' /tmp/lang.headers
          # regression: a reverse proxy that rewrites Host must not block the login POST
          code=$(curl -ks -o /dev/null -w '%{http_code}' -X POST https://127.0.0.1:3443/login \
            -H 'Host: 127.0.0.1:3443' \
            -H 'X-Forwarded-Host: planet.example.com' \
            -H 'Origin: https://planet.example.com' \
            --data 'user=admin&password=definitely-wrong')
          echo "login through a proxy: $code"
          [ "$code" != "403" ]
          # cross-site submissions are still refused
          code=$(curl -ks -o /dev/null -w '%{http_code}' -X POST https://127.0.0.1:3443/login \
            -H 'Host: planet.example.com' \
            -H 'Origin: https://evil.example.com' \
            --data 'user=admin&password=x')
          echo "cross-site login: $code"
          [ "$code" = "403" ]
          # regression: in-app WebViews send an opaque origin ("Origin: null")
          # and must land on the credential check instead of a 403
          code=$(curl -ks -o /dev/null -w '%{http_code}' -X POST https://127.0.0.1:3443/login \
            -H 'Host: 127.0.0.1:3443' \
            -H 'Origin: null' \
            --data 'user=admin&password=definitely-wrong')
          echo "opaque origin login: $code"
          [ "$code" != "403" ]
          # the brand mark is served and the login page no longer points at the
          # password file (the hint lives in the 1Panel app documentation)
          curl -ksf https://127.0.0.1:3443/images/zt-mark.svg -o /tmp/zt-mark.svg
          grep -q '#FFC078' /tmp/zt-mark.svg
          grep -q 'zt-mark.svg' /tmp/login-zh.html
          if grep -q 'admin-password' /tmp/login-zh.html /tmp/login-en.html; then
            echo "::error::the login page still mentions the password file"; exit 1
          fi

      - name: Verify two-step verification is wired through
        run: |
          set -euo pipefail
          node tests/totp.test.js

          jar=/tmp/zt-jar
          newpass='smoke-2fa-pass-1234'
          login() {
            rm -f "$jar"
            curl -ks -c "$jar" -b "$jar" -o /dev/null -w '%{redirect_url}' -X POST \
              --data 'username=admin' --data-urlencode "password=$1" \
              https://127.0.0.1:3443/login
          }

          # The bootstrap password is one-time: replace it first, which also
          # exercises the forced password change.
          # The password file is a short human-readable block, not a bare secret.
          pass=$(docker exec zt-smoke sed -n 's/^password: //p' /app/config/admin-password)
          echo "bootstrap password length: ${#pass}"
          [ "${#pass}" -ge 20 ]
          location=$(login "$pass")
          echo "bootstrap login lands on: $location"
          status=$(curl -ks -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST \
            --data-urlencode "password1=$newpass" --data-urlencode "password2=$newpass" \
            https://127.0.0.1:3443/users/admin/password)
          echo "password change: $status"
          [ "$status" = "200" ]
          if docker exec zt-smoke test -e /app/config/admin-password; then
            echo "::error::the bootstrap password file survived the password change"; exit 1
          fi

          status=$(curl -ks -b "$jar" -c "$jar" -o /tmp/totp.html -w '%{http_code}' \
            https://127.0.0.1:3443/users/admin/totp)
          echo "two-factor page: $status"
          [ "$status" = "200" ]
          grep -q 'id="totp-secret"' /tmp/totp.html
          grep -q 'otpauth://' /tmp/totp.html
          secret=$(sed -n 's/.*id="totp-secret"[^>]*value="\([^"]*\)".*/\1/p' /tmp/totp.html | tr -d ' ')
          echo "enrollment secret length: ${#secret}"
          [ "${#secret}" -eq 32 ]

          code=$(node -e "const t=require('./patch/ztncui/totp.js');console.log(t.generate('$secret'))")
          status=$(curl -ks -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST \
            -d "code=$code" https://127.0.0.1:3443/users/admin/totp/enable)
          echo "enable status: $status"
          [ "$status" = "302" ]

          curl -ks -b "$jar" -c "$jar" https://127.0.0.1:3443/users/admin/totp -o /tmp/totp-enabled.html
          if ! grep -Eq '[A-Z2-9]{4}-[A-Z2-9]{4}' /tmp/totp-enabled.html; then
            echo "::error::no backup codes were shown after enabling TOTP"; exit 1
          fi

          # The enrollment token belongs to the current 30 s step, so wait for the
          # next one: replays inside a step are refused by design.
          node -e 'setTimeout(() => process.exit(0), (30 - (Math.floor(Date.now() / 1000) % 30)) * 1000 + 1500)'
          code=$(node -e "const t=require('./patch/ztncui/totp.js');console.log(t.generate('$secret'))")

          location=$(login "$newpass")
          echo "password-only login lands on: $location"
          case "$location" in
            *'/login/2fa') ;;
            *) echo "::error::TOTP did not gate the sign-in"; exit 1 ;;
          esac
          status=$(curl -ks -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST \
            -d "code=$code" https://127.0.0.1:3443/login/2fa)
          echo "token status: $status"
          [ "$status" = "302" ]
          status=$(curl -ks -b "$jar" -o /dev/null -w '%{http_code}' https://127.0.0.1:3443/controller)
          echo "controller after 2FA: $status"
          [ "$status" = "200" ]

          # a wrong token must not open a session
          login "$newpass" > /dev/null
          status=$(curl -ks -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST \
            -d 'code=000000' https://127.0.0.1:3443/login/2fa)
          echo "wrong token status: $status"
          [ "$status" = "401" ]

      - name: Verify passkey enrollment is wired through
        run: |
          set -euo pipefail
          node tests/webauthn.test.js

          # The browser bundle must be part of the image and served from /js.
          curl -ksf https://127.0.0.1:3443/js/passkey.js -o /tmp/passkey.js
          grep -q 'navigator.credentials' /tmp/passkey.js

          # Anonymous callers must not reach the enrollment page or the JSON API.
          status=$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:3443/users/admin/passkeys)
          echo "anonymous passkey page: $status"
          [ "$status" = "302" ]
          status=$(curl -ks -o /dev/null -w '%{http_code}' -X POST https://127.0.0.1:3443/users/admin/passkeys/begin)
          echo "anonymous begin: $status"
          [ "$status" = "302" ] || [ "$status" = "401" ]

          # Without a pending sign-in there is nothing to verify against.
          location=$(curl -ks -o /dev/null -w '%{redirect_url}' https://127.0.0.1:3443/login/passkey)
          echo "login/passkey without a session: ${location}"
          case "$location" in
            *'/login') ;;
            *) echo "::error::/login/passkey should bounce to /login"; exit 1 ;;
          esac
          status=$(curl -ks -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{}' https://127.0.0.1:3443/login/passkey/begin)
          echo "passkey begin without a session: $status"
          [ "$status" = "401" ]

      - name: Verify the file server requires authentication
        run: |
          set -euo pipefail
          code=$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:3000/planet)
          echo "unauthenticated planet: $code"
          [ "$code" = "401" ]
          code=$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:3000/healthz)
          [ "$code" = "200" ]
          key=$(docker exec zt-smoke cat /app/config/file_server.key)
          curl -ksf -H "Authorization: Bearer $key" https://127.0.0.1:3000/planet -o /tmp/planet.download
          cmp /tmp/planet.download /tmp/zt/dist/planet
          # the legacy query-string key must stay disabled by default
          code=$(curl -ks -o /dev/null -w '%{http_code}' "https://127.0.0.1:3000/planet?key=$key")
          echo "query-string key: $code"
          [ "$code" = "401" ]

      - name: Verify the file server rejects path traversal
        run: |
          set -euo pipefail
          key=$(docker exec zt-smoke cat /app/config/file_server.key)
          for target in "/../etc/passwd" "/%2e%2e/%2e%2e/etc/passwd" "/..%2f..%2fetc%2fpasswd" "/zzz.moon" "/config/admin-password"; do
            code=$(curl -ks -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $key" "https://127.0.0.1:3000${target}")
            echo "$target -> $code"
            [ "$code" = "404" ] || { echo "::error::unexpected status for $target"; exit 1; }
          done

      - name: Collect logs on failure
        if: failure()
        run: |
          docker logs zt-smoke 2>&1 || true
          docker exec zt-smoke sh -c 'ls -la /app/config /app/dist' || true

      - name: Stop the container
        if: always()
        run: docker rm -f zt-smoke || true

  # -------------------------------------------------------------------------
  # Publish: a multi-arch manifest in GHCR plus the archives on the Release.
  # -------------------------------------------------------------------------
  release:
    needs: [prepare, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional Docker Hub mirror; both steps below are skipped when the
      # DOCKERHUB_* repository secrets are not configured.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # Optional Tencent Cloud TCR mirror. TCR_REGISTRY is ccr.ccs.tencentyun.com
      # for the personal edition, or <instance>.tencentcloudcr.com for an
      # enterprise instance. All four values must be set or the step is skipped.
      TCR_REGISTRY: ${{ secrets.TCR_REGISTRY }}
      TCR_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
    steps:
      # Needed for 1panel/apps, which is packaged into a release asset below.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged images
        uses: actions/download-artifact@v4
        with:
          # Only the archives this workflow uploaded. Without the pattern the
          # action also tries to fetch the buildx layer-cache entries, which are
          # not downloadable artifacts and make the step fail after 5 retries.
          pattern: image-*
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      # The 1Panel app package lives in the repo (1panel/apps/zerotier-planet).
      # Ship it as an asset so the panel can be fed from a Release without a
      # git checkout. The tarball has the app directory at its root, so
      # `tar -xzf` into .../resource/apps/local/ drops it in place.
      - name: Package the 1Panel app
        env:
          TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          tar -czf "dist/1panel-app-${TAG}.tar.gz" -C 1panel/apps zerotier-planet
          tar -tzf "dist/1panel-app-${TAG}.tar.gz" | head -20
          ls -lh "dist/1panel-app-${TAG}.tar.gz"

      - name: Attach the 1Panel cron helper
        run: |
          set -euo pipefail
          cp scripts/1panel-scheduled-update.sh dist/1panel-scheduled-update.sh
          chmod 755 dist/1panel-scheduled-update.sh
          bash -n dist/1panel-scheduled-update.sh
          ls -lh dist/1panel-scheduled-update.sh

      - name: Combine checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          for f in *.tar.gz 1panel-scheduled-update.sh; do sha256sum "$f" >> SHA256SUMS; done
          cat SHA256SUMS

      - name: Write the release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          # Docker Hub is the default registry; fall back to GHCR when it is not configured.
          if [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            DEFAULT_IMAGE="docker.io/${DOCKERHUB_USERNAME}/zerotier-planet"
          else
            DEFAULT_IMAGE="${IMAGE}"
          fi
          export DEFAULT_IMAGE
          {
            echo "# zerotier-planet-2.0 — ${VERSION}"
            echo
            echo "Self-hosted ZeroTier planet + network controller, based on"
            echo "[xubiaolin/docker-zerotier-planet](https://github.com/xubiaolin/docker-zerotier-planet)."
            echo
            echo "## Versions"
            echo
            echo "| Component | Version |"
            echo "| --- | --- |"
            echo "| ZeroTier One | ${ZT_VERSION} |"
            echo "| ztncui (pinned commit) | \`${ZTNCUI_COMMIT}\` |"
            echo "| Base images | debian:bookworm-slim, node:24-bookworm-slim (digest-pinned) |"
            echo
            echo "## Assets"
            echo
            echo "| File | Description |"
            echo "| --- | --- |"
            for f in dist/*.tar.gz; do
              base="$(basename "$f")"
              case "$base" in
                1panel-app-*) desc="1Panel app package (extract into /opt/1panel/resource/apps/local)" ;;
                *) desc="\`docker save\` archive, load with \`docker load\`" ;;
              esac
              echo "| \`$base\` | $desc |"
            done
            echo "| \`SHA256SUMS\` | Checksums for every archive |"
            echo "| \`SOURCE\` | Exact upstream commits and build arguments |"
            echo "| \`LOAD-*.txt\` | Load/run instructions |"
            echo "| \`1panel-scheduled-update.sh\` | 1Panel cron helper: install it as a Shell script cron job to follow new releases |"
            echo
            echo "## Load and run"
            echo
            echo '```bash'
            echo "docker load < zerotier-planet-2.0-${TAG}-amd64.tar.gz"
            echo "docker run -d --name zerotier-planet --restart unless-stopped \\"
            echo "  -p 9994:9994/udp -p 3443:3443/tcp -p 3000:3000/tcp \\"
            echo "  -e IP_ADDR4=203.0.113.10 \\"
            echo "  -v \"\$PWD/data/config:/app/config\" \\"
            echo "  -v \"\$PWD/data/dist:/app/dist\" \\"
            echo "  -v \"\$PWD/data/one:/var/lib/zerotier-one\" \\"
            echo "  ${DEFAULT_IMAGE}:${TAG}"
            echo '```'
            echo
            echo "## Images"
            echo
            echo "| Registry | Reference | Notes |"
            echo "| --- | --- | --- |"
            if [ -n "${DOCKERHUB_USERNAME:-}" ]; then
              echo "| Docker Hub | \`docker.io/${DOCKERHUB_USERNAME}/zerotier-planet:${TAG}\` | default |"
            fi
            echo "| GHCR | \`${IMAGE}:${TAG}\` | alternative |"
            echo
            echo "Both references point at the same multi-arch manifest (\`linux/amd64\` + \`linux/arm64\`)."
            echo
            echo "## 1Panel"
            echo
            echo "The app package above can be installed by hand, or you can let the cron helper"
            echo "keep the local store current — one line, no checkout:"
            echo
            echo '```bash'
            echo "curl -fsSL https://github.com/ban-sky/zerotier-planet-2.0/releases/latest/download/1panel-scheduled-update.sh \\"
            echo "  | sudo bash -s -- --quiet"
            echo '```'
            echo
            echo "This release also ships \`1panel-app-${TAG}.tar.gz\`, a local app package for"
            echo "[1Panel](https://1panel.cn/):"
            echo
            echo '```bash'
            echo "sudo tar -xzf 1panel-app-${TAG}.tar.gz -C /opt/1panel/resource/apps/local"
            echo '```'
            echo
            echo "On mainland-China servers (or any network where github.com is blocked) pin the"
            echo "channel instead — the helper then talks to jsDelivr only:"
            echo
            echo '```bash'
            echo "sudo bash 1panel-scheduled-update.sh --source cdn --quiet"
            echo '```'
            echo
            echo "Then refresh the app list in the panel (App Store → Update app list) and install"
            echo "**ZeroTier Planet**. The repository also ships \`scripts/install-1panel-app.sh\` for"
            echo "the same job."
            echo
            echo "The initial admin password is in \`/app/config/admin-password\` inside the container;"
            echo "change it at first login, after which the file is deleted."
            echo
            echo "## Highlights in this build"
            echo
            echo "- **Two-step verification (TOTP)** can be enabled per admin account; a correct"
            echo "  password only reaches \`/login/2fa\`, and tokens cannot be replayed."
            echo "- Single-use backup codes, and disabling a factor requires the password plus a code."
            echo "- The 1Panel app-store icon follows the official ZeroTier brand mark."
            echo "- Admin UI still renders in **Simplified Chinese** or English (\`DEFAULT_LOCALE\`)."
            echo "- \`1panel-scheduled-update.sh\` keeps a 1Panel install on the latest release."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Write the build provenance file
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          {
            echo "version=${VERSION}"
            echo "image_tag=${TAG}"
            echo "repo=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "zerotier_version=${ZT_VERSION}"
            echo "zerotier_commit=${ZT_COMMIT}"
            echo "ztncui_commit=${ZTNCUI_COMMIT}"
            echo "debian_base=debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc"
            echo "node_base=node:24-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54"
            echo "built_by=GitHub Actions"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/SOURCE
          cat dist/SOURCE

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: zerotier-planet-2.0 ${{ needs.prepare.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SOURCE
            dist/LOAD-*.txt
            dist/1panel-scheduled-update.sh

      - name: Publish the multi-arch image to GHCR
        env:
          TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          tags=""
          if docker manifest inspect "${IMAGE}:${TAG}-amd64" >/dev/null 2>&1; then
            tags="${IMAGE}:${TAG}-amd64"
          fi
          if docker manifest inspect "${IMAGE}:${TAG}-arm64" >/dev/null 2>&1; then
            tags="$tags ${IMAGE}:${TAG}-arm64"
          fi
          [ -n "$tags" ] || { echo "::error::no per-arch images found in GHCR"; exit 1; }
          echo "creating manifest for: $tags"
          docker buildx imagetools create -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" $tags
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

      # Optional: publish the same multi-arch image on Docker Hub.
      # See .github/workflows/image-build.yml for the one-off setup
      # (repository + DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets).
      - name: Mirror the release to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        env:
          TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin
          dst="docker.io/${DOCKERHUB_USERNAME}/zerotier-planet"
          for tag in "${TAG}" latest; do
            docker buildx imagetools create -t "${dst}:${tag}" "${IMAGE}:${tag}"
          done
          docker buildx imagetools inspect "${dst}:${TAG}"

      # Optional: publish the same multi-arch image to Tencent Cloud TCR
      # (容器镜像服务). Personal edition uses ccr.ccs.tencentyun.com with the
      # Tencent Cloud account id as the username and the registry password; an
      # enterprise instance uses <instance>.tencentcloudcr.com. TCR does not
      # always accept a cross-registry manifest copy, so this step pulls the
      # GHCR manifest and re-pushes it, falling back to a plain rebuild if the
      # copy is rejected.
      - name: Mirror the release to Tencent Cloud TCR
        if: env.TCR_PASSWORD != '' && env.TCR_REGISTRY != ''
        env:
          TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          echo "${TCR_PASSWORD}" | docker login "${TCR_REGISTRY}" -u "${TCR_USERNAME}" --password-stdin
          dst="${TCR_REGISTRY}/${TCR_NAMESPACE}/zerotier-planet"
          for tag in "${TAG}" latest; do
            src="${IMAGE}:${tag}"
            if docker buildx imagetools create -t "${dst}:${tag}" "${src}"; then
              echo "copied ${src} -> ${dst}:${tag}"
            else
              echo "::warning::manifest copy to TCR failed for ${tag}; retrying with a build"
              docker buildx build \
                --platform linux/amd64,linux/arm64 \
                --build-arg ZT_VERSION="${ZT_VERSION}" \
                --build-arg ZT_COMMIT="${ZT_COMMIT}" \
                --build-arg ZTNCUI_COMMIT="${ZTNCUI_COMMIT}" \
                --push -t "${dst}:${tag}" .
            fi
          done
          docker buildx imagetools inspect "${dst}:${TAG}"
